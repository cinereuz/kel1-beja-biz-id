<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page - KELOMPOK 1</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Menggunakan font Arial secara konsisten */
    * {
      font-family: Arial, Helvetica, sans-serif !important;
    }

    /* Mencegah scrollbar pada semua browser & device */
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
    }

    /* Ambient background grid pattern halus */
    .bg-grid-pattern {
      background-image: 
        radial-gradient(circle at center, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }
  </style>
</head>
<body class="bg-[#050508] text-white h-[100dvh] w-screen relative overflow-hidden flex flex-col justify-between items-center bg-grid-pattern">

  <!-- Ambient Glow Background (Pencahayaan Atmosferik Lembut) -->
  <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
    <div class="w-[300px] h-[300px] md:w-[650px] md:h-[650px] rounded-full bg-white/[0.03] blur-[130px]"></div>
    <div class="absolute w-[180px] h-[180px] md:w-[350px] md:h-[350px] rounded-full bg-zinc-300/[0.04] blur-[90px]"></div>

  <!-- ==================== DESKTOP LAYOUT (Pola Bintang 5 Titik Presisi) ==================== -->
  <main class="hidden md:flex flex-col items-center justify-center w-full h-full relative z-10 px-6">

        />

      <a href="https://kel1.beja.biz.id" target="_blank" rel="noopener noreferrer" class="inline-block group cursor-pointer" title="Buka kel1.beja.biz.id">
